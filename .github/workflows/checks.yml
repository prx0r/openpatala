name: Openpatala checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime deps (DB-free checks only)
        run: pip install 'fastapi>=0.100' 'psycopg2-binary>=2.9' 'mcp>=1.9' 'rfc8785' 'uuid6' 'python-dotenv'
      - name: Syntax compile
        run: python3 -m compileall -q patala tools
      - name: API + MCP import (no DB)
        run: |
          python3 -c "import patala.api; print('api ok')"
          python3 -c "from patala.mcp_server import server; assert server is not None; print('mcp ok')" || echo "mcp server needs deps; skipped"
      - name: Documentation gate (DB claims skip without a DB)
        run: python3 tools/doc_check.py
      - name: Doc-gate self-tests
        run: python3 -m unittest tools.test_doc_check -v
      - name: MCP acceptance (skips loudly without the box DB)
        run: PYTHONPATH=. python3 tools/mcp_acceptance_run.py
